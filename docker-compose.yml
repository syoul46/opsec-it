name: ${COMPOSE_PROJECT_NAME:-opsec-it-local}

services:
  app:
    image: opsec-it:${TAG:-local}
    container_name: ${COMPOSE_PROJECT_NAME:-opsec-it-local}-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${PORT:-3000}:3000"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - NEXT_PUBLIC_SITE_URL=${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      # Fabio routing (à activer sur sonic avec la bonne valeur APP_DOMAIN)
      - "SERVICE_3000_NAME=${COMPOSE_PROJECT_NAME:-opsec-it-local}-app-3000"
      - "SERVICE_3000_TAGS=urlprefix-${APP_DOMAIN:-localhost}/*"
      - "SERVICE_3000_CHECK_TCP=true"
