# Déploiement d'opsec-it.fr sur le CX23 (Nuremberg), aux côtés de maeva-runner.
#
# Seul fichier de déploiement du projet : les anciens compose (racine) et la pipeline
# Woodpecker visaient sonic, une machine qui n'héberge plus ce site. Ils ont été
# supprimés — ne pas les réintroduire, la cible est ce CX23.
#
# Le conteneur n'écoute QUE sur la boucle locale : Caddy est le seul process exposé à
# Internet, exactement comme le runner maeva sur 8080. Ne pas remplacer par "3000:3000",
# ce qui publierait le port sur l'IP publique en contournant Caddy et le pare-feu Hetzner.
#
# Déployer :
#   cd /opt/opsec-it && docker compose -f deploy/docker-compose.yml up -d --build
#
# Le fichier deploy/.env (chmod 600, jamais commité) porte RESEND_API_KEY.

name: opsec-it

services:
  app:
    build:
      context: ..
      dockerfile: Dockerfile
    image: opsec-it:local
    container_name: opsec-it-app
    restart: unless-stopped

    ports:
      - "127.0.0.1:3000:3000"

    environment:
      - NODE_ENV=production
      # Absente = le formulaire de contact logge ici au lieu d'envoyer, et répond
      # quand même "success" au visiteur (app/api/contact/route.ts). Les messages
      # sont alors dans `docker compose logs`, pas dans la boîte mail.
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      # Destinataire des messages du formulaire. Hors du dépôt, qui est public :
      # c'est une boîte personnelle, elle n'a rien à faire sur github.com.
      # Absente = même repli que ci-dessus (journal, pas d'envoi).
      - CONTACT_TO=${CONTACT_TO:-}
      # Expéditeur. Doit appartenir à un domaine vérifié chez Resend ; tant que
      # opsec-it.fr ne l'est pas, laisser vide pour garder le repli bac à sable
      # `onboarding@resend.dev`. Procédure : README, section E-mail.
      - CONTACT_FROM=${CONTACT_FROM:-}

    # Durcissement du conteneur. Le process tournait deja en non-root (USER nextjs
    # dans le Dockerfile), mais gardait TOUTES les capacites Linux par defaut et un
    # systeme de fichiers inscriptible. Ces quatre reglages ne coutent rien ici : le
    # site est un serveur Next en lecture seule, il ne lie aucun port privilegie et
    # ne change jamais d'identite.
    #
    # `read_only` impose les deux tmpfs qui suivent : Next ecrit dans /tmp, et
    # `.next/cache` porte le cache d'optimisation des images de next/image. Sans
    # eux le conteneur demarre puis echoue a la premiere image servie.
    read_only: true
    tmpfs:
      - /tmp
      - /app/.next/cache
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # Plafond de processus : borne un fork bomb ou un runaway a l'interieur du
    # conteneur avant qu'il n'atteigne la table de processus de l'hote, partagee
    # avec maeva-runner.
    pids_limit: 256

    # La machine a 4 Go partagés avec maeva-runner. Le site tourne à ~200 Mo ;
    # cette limite est un garde-fou pour qu'une fuite côté site ne fasse pas
    # tomber le runner par OOM.
    mem_limit: 512m

    # 127.0.0.1 et pas `localhost` : dans l'image Alpine, `localhost` resout
    # d'abord sur ::1, alors que le serveur Next n'ecoute qu'en IPv4 (HOSTNAME
    # 0.0.0.0 dans le Dockerfile). Le healthcheck echouait donc depuis toujours
    # — 95 000 echecs d'affilee au moment ou le probleme a ete vu — en signalant
    # « unhealthy » un conteneur parfaitement sain.
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
