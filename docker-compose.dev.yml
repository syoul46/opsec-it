name: ${COMPOSE_PROJECT_NAME:-opsec-it-dev}

services:
  app:
    image: opsec-it:${TAG:-dev}
    container_name: ${COMPOSE_PROJECT_NAME:-opsec-it-dev}-app
    restart: always
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
    environment:
      - NODE_ENV=production
      - APP_DOMAIN=${APP_DOMAIN:-dev.opsec-it.fr}
      - NEXT_PUBLIC_SITE_URL=https://${APP_DOMAIN:-dev.opsec-it.fr}
      - RESEND_API_KEY=${RESEND_API_KEY}
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    labels:
      - SERVICE_3000_NAME=${COMPOSE_PROJECT_NAME:-opsec-it-dev}-app-3000
      - SERVICE_3000_TAGS=urlprefix-${APP_DOMAIN:-dev.opsec-it.fr}/*
      - SERVICE_3000_CHECK_TCP=true
    networks:
      - sonic

networks:
  sonic:
    external: true
