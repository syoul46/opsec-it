name: opsec-it-dev

services:
  app:
    image: opsec-it:dev
    build:
      context: .
      dockerfile: Dockerfile
    container_name: opsec-it-dev-app
    command: npm run dev
    ports:
      - "3001:3000"
    environment:
      - NODE_ENV=development
      - NEXT_PUBLIC_SITE_URL=http://localhost:3001
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next
    labels:
      - "SERVICE_3000_NAME=opsec-it-dev-app-3000"
      - "SERVICE_3000_TAGS=urlprefix-dev.opsec-it.fr/*"
      - "SERVICE_3000_CHECK_TCP=true"
