when:
  - event: push

steps:

  # ── Validation syntaxique du compose ───────────────────────────────────────
  - name: validate
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        if [ "$CI_COMMIT_BRANCH" = "main" ]; then
          COMPOSE_FILE="docker-compose.prod.yml"
        else
          COMPOSE_FILE="docker-compose.dev.yml"
        fi
        export APP_DOMAIN=validate.example.com
        export RESEND_API_KEY=placeholder
        export TAG=placeholder
        export COMPOSE_PROJECT_NAME="opsec-it-validate"
        docker compose -f "$COMPOSE_FILE" config --quiet
      - echo "compose valide"

  # ── Contrôle sécurité : pas de .env commité ───────────────────────────────
  - name: security-check
    image: alpine:3.20
    commands:
      - |
        if [ -f .env ]; then
          echo "ERREUR: .env ne doit pas etre commite"
          exit 1
        fi
      - 'grep -qE "^\.env" .gitignore || (echo "ERREUR: .env manquant dans .gitignore" && exit 1)'
      - echo "Security check OK"

  # ── Build image Docker ─────────────────────────────────────────────────────
  - name: build-image
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - |
        BRANCH=$(echo "$CI_COMMIT_BRANCH" | tr 'A-Z/' 'a-z-')
        TAG=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
        docker build --tag "opsec-it:$TAG" --tag "opsec-it:$BRANCH" .
        echo "Build OK : opsec-it:$TAG / opsec-it:$BRANCH"

  # ── SBOM : génération inventaire CycloneDX ────────────────────────────────
  - name: sbom-generate
    image: alpine:3.20
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    commands:
      - apk add --no-cache curl tar
      - curl -sSfL "https://github.com/anchore/syft/releases/download/v1.42.3/syft_1.42.3_linux_amd64.tar.gz" | tar xz -C /usr/local/bin syft
      - mkdir -p .reports
      - |
        BRANCH=$(echo "$CI_COMMIT_BRANCH" | tr 'A-Z/' 'a-z-')
        syft packages docker:"opsec-it:$BRANCH" -o cyclonedx-json=.reports/sbom-app.cyclonedx.json
      - echo "SBOM genere"

  # ── SBOM : scan CVE Trivy ─────────────────────────────────────────────────
  - name: sbom-scan
    image: aquasec/trivy:0.69.3
    volumes:
      - /home/syoul/trivy-cache:/root/.cache/trivy
    commands:
      - trivy sbom --format json --output .reports/trivy-app.json .reports/sbom-app.cyclonedx.json
      - echo "Scan CVE termine"

  # ── SBOM : publication vers Dependency-Track ─────────────────────────────
  - name: sbom-publish
    image: alpine/curl:latest
    environment:
      DTRACK_TOKEN:
        from_secret: dependency_track_token
      DTRACK_DOMAIN:
        from_secret: dtrack_domain
    commands:
      - |
        VERSION=$(date +%Y-%m-%d)-$(echo "$CI_COMMIT_SHA" | cut -c1-8)
        BRANCH=$(echo "$CI_COMMIT_BRANCH" | tr 'A-Z/' 'a-z-')
        HTTP=$(curl -s -o /tmp/dtrack-resp.txt -w "%{http_code}" -X POST "https://$DTRACK_DOMAIN/api/v1/bom" \
          -H "X-Api-Key: $DTRACK_TOKEN" \
          -F "autoCreate=true" \
          -F "projectName=opsec-it-$BRANCH" \
          -F "projectVersion=$VERSION" \
          -F "bom=@.reports/sbom-app.cyclonedx.json")
        echo "HTTP $HTTP : $(cat /tmp/dtrack-resp.txt)"
        [ "$HTTP" -ge 200 ] && [ "$HTTP" -lt 300 ] || exit 1

  # ── Écriture du .env.deploy ───────────────────────────────────────────────
  - name: write-env
    image: alpine:3.20
    environment:
      APP_DOMAIN_PROD:
        from_secret: app_domain_prod
      APP_DOMAIN_DEV:
        from_secret: app_domain_dev
      RESEND_API_KEY:
        from_secret: resend_api_key
    commands:
      - |
        if [ "$CI_COMMIT_BRANCH" = "main" ]; then
          APP_DOMAIN="$APP_DOMAIN_PROD"
          COMPOSE_FILE="docker-compose.prod.yml"
          COMPOSE_PROJECT="opsec-it-prod"
        else
          BRANCH=$(echo "$CI_COMMIT_BRANCH" | tr 'A-Z/' 'a-z-')
          APP_DOMAIN="$APP_DOMAIN_DEV"
          COMPOSE_FILE="docker-compose.dev.yml"
          COMPOSE_PROJECT="opsec-it-$BRANCH"
        fi
        TAG=$(echo "$CI_COMMIT_SHA" | cut -c1-8)
        echo "APP_DOMAIN=$APP_DOMAIN"             > .env.deploy
        echo "RESEND_API_KEY=$RESEND_API_KEY"     >> .env.deploy
        echo "TAG=$TAG"                            >> .env.deploy
        echo "COMPOSE_PROJECT_NAME=$COMPOSE_PROJECT" >> .env.deploy
        echo "COMPOSE_FILE=$COMPOSE_FILE"          >> .env.deploy
        echo ".env.deploy ecrit"

  # ── Validation du .env.deploy ─────────────────────────────────────────────
  - name: test-env
    image: alpine:3.20
    commands:
      - '[ -f .env.deploy ] || { echo "FAIL: .env.deploy introuvable"; exit 1; }'
      - |
        for KEY in COMPOSE_PROJECT_NAME APP_DOMAIN TAG; do
          VAL=$(grep "^$KEY=" .env.deploy | cut -d= -f2)
          [ -z "$VAL" ] && echo "FAIL: $KEY vide" && exit 1
          echo "PASS: $KEY = $VAL"
        done

  # ── Deploy sur sonic ──────────────────────────────────────────────────────
  - name: deploy
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/opsec-it:/opt/opsec-it
    commands:
      - cp .env.deploy /opt/opsec-it/.env
      - chmod 600 /opt/opsec-it/.env
      - |
        CFILE=$(grep '^COMPOSE_FILE=' /opt/opsec-it/.env | cut -d= -f2)
        cp "$CFILE" /opt/opsec-it/docker-compose.yml
      - cd /opt/opsec-it && docker compose stop
      - |
        DOMAIN=$(grep '^APP_DOMAIN=' /opt/opsec-it/.env | cut -d= -f2)
        ACME_EXIT=0
        docker exec sonic-acme-1 /app/acme.sh \
          --home /etc/acme.sh \
          --issue -d "$DOMAIN" \
          --webroot /usr/share/nginx/html \
          --server letsencrypt \
          --accountemail support+acme@asycn.io || ACME_EXIT=$?
        if [ "$ACME_EXIT" -ne 0 ] && [ "$ACME_EXIT" -ne 2 ]; then
          echo "ERREUR: acme.sh a echoue (exit $ACME_EXIT)"
          exit 1
        fi
        docker exec sonic-acme-1 cp "/etc/acme.sh/$DOMAIN/fullchain.cer" "/host/certs/$DOMAIN-cert.pem"
        docker exec sonic-acme-1 cp "/etc/acme.sh/$DOMAIN/$DOMAIN.key"  "/host/certs/$DOMAIN-key.pem"
        echo "TLS OK (acme exit $ACME_EXIT)"
      - cd /opt/opsec-it && docker compose up -d --remove-orphans
      - cd /opt/opsec-it && docker compose ps

  # ── Vérification containers running ──────────────────────────────────────
  - name: test-deploy
    image: docker:27-cli
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - /opt/opsec-it:/opt/opsec-it
    commands:
      - |
        PROJECT=$(grep '^COMPOSE_PROJECT_NAME=' /opt/opsec-it/.env | cut -d= -f2)
        STATUS=$(docker inspect --format '{{.State.Status}}' "$PROJECT-app" 2>/dev/null || echo "absent")
        echo "$PROJECT-app : $STATUS"
        [ "$STATUS" = "running" ] || { echo "FAIL: container non running"; exit 1; }
        echo "PASS: container running"

  # ── Healthcheck HTTP ──────────────────────────────────────────────────────
  - name: healthcheck
    image: alpine:3.20
    commands:
      - apk add --no-cache --quiet curl
      - |
        SITE=$(grep '^APP_DOMAIN=' .env.deploy | cut -d= -f2)
        TARGET="https://$SITE/api/health"
        MAX=60
        i=0
        until [ $i -ge $MAX ]; do
          CODE=$(curl -sSo /dev/null -w "%{http_code}" "$TARGET" 2>/dev/null)
          echo "Tentative $((i+1))/$MAX - HTTP $CODE"
          [ "$CODE" = "200" ] && echo "PASS: app repond sur $TARGET" && exit 0
          i=$((i+1))
          sleep 10
        done
        echo "FAIL: app ne repond pas apres 10 minutes"
        exit 1

  # ── Notification échec ───────────────────────────────────────────────────
  - name: notify-failure
    image: alpine:3.20
    commands:
      - 'echo "ECHEC pipeline #$CI_BUILD_NUMBER sur $CI_COMMIT_BRANCH ($CI_COMMIT_SHA)"'
    when:
      - status: failure
